<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>2027届医药秋招雷达</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#64748b;--line:#e2e8f0;--brand:#2457d6;--soft:#eaf0ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
header{background:linear-gradient(120deg,#132956,#2457d6);color:white;padding:28px max(20px,calc((100vw - 1180px)/2))}
header h1{margin:0 0 6px;font-size:clamp(25px,4vw,36px)}header p{margin:0;color:#dbe7ff}
main{max-width:1180px;margin:22px auto;padding:0 16px 48px}.notice{background:#fff7df;border:1px solid #f1d58a;padding:12px 14px;border-radius:12px;margin-bottom:16px;color:#6b4d00}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.stat,.panel,.job{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}.stat strong{font-size:28px;display:block}.stat span,.muted{color:var(--muted);font-size:13px}
.layout{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}.panel h2{font-size:18px;margin:0 0 12px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:14px}
input,select,button,textarea{font:inherit;border:1px solid var(--line);border-radius:9px;padding:10px;background:white;color:var(--ink);max-width:100%}button{cursor:pointer;background:var(--brand);border-color:var(--brand);color:white;font-weight:600}button.secondary{background:white;color:var(--ink);border-color:var(--line)}.jobs{display:grid;gap:10px}.job h3{font-size:17px;margin:0}.jobtop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.tag{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--soft);color:var(--brand);white-space:nowrap}.job p{margin:8px 0;color:var(--muted);font-size:13px}.job a{color:var(--brand);font-weight:600;text-decoration:none}.jobfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
form{display:grid;gap:9px}label{display:grid;gap:4px;font-size:13px;color:var(--muted)}.tracking-list{display:grid;gap:8px}.tracking-item{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;grid-template-columns:1fr 125px 34px;gap:8px;align-items:center}.tracking-item b{display:block}.tracking-item small{color:var(--muted)}
footer{max-width:1180px;margin:auto;padding:0 16px 30px;color:var(--muted);font-size:12px}
@media(max-width:780px){.stats{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.tracking-item{grid-template-columns:1fr 120px 30px}}
</style></head><body>
<header><h1>2027届医药秋招雷达</h1><p>药企 · CRO · 医疗器械 · 医学事务 · 临床运营 · 产品与市场｜招聘线索与个人投递一站管理</p></header>
<main><div class="notice"><b>数据说明：</b>招聘线索会尽可能定期检查，但无法保证覆盖全部企业或绝对实时。请通过链接核对当前招聘状态、截止时间及岗位要求。企业招聘入口不等同于确认在招岗位。</div>
<div class="stats"><div class="stat"><span>企业入口/招聘线索</span><strong id="jobCount">—</strong></div><div class="stat"><span>已投递</span><strong id="appliedCount">0</strong></div><div class="stat"><span>面试中</span><strong id="interviewCount">0</strong></div><div class="stat"><span>已获 Offer</span><strong id="offerCount">0</strong></div></div>
<div class="layout"><section class="panel"><h2>招聘信息</h2><div class="filters"><input id="q" placeholder="搜索公司、岗位、关键词…"><select id="kind"><option value="">全部企业类型</option><option>外资药企</option><option>内资药企</option><option>CRO/临床服务</option><option>医疗器械</option><option>生命科学/其他</option></select><select id="direction"><option value="">全部方向</option><option>MSL/医学事务</option><option>产品/市场</option><option>CRA/临床运营</option><option>注册/药物警戒</option><option>研发/实验</option><option>销售/医药代表</option><option>综合校招</option></select></div><p class="muted" id="lastUpdated">数据文件更新时间：读取中</p><div id="jobs" class="jobs"><p class="muted">正在读取招聘数据…</p></div></section>
<aside class="panel"><h2>我的投递进度</h2><p class="muted">数据保存在本浏览器。清除浏览器数据后可能丢失，请定期导出备份。</p>
<form id="trackForm"><label>公司<input id="company" required placeholder="例如：阿斯利康"></label><label>岗位<input id="role" required placeholder="例如：产品专员"></label><label>申请日期<input id="date" type="date"></label><label>进度<select id="status"><option>已投递</option><option>面试中</option><option>已获Offer</option><option>已结束</option><option>准备投递</option></select></label><label>备注<textarea id="note" rows="2" placeholder="面试轮次、联系人、截止时间…"></textarea></label><button type="submit">添加投递记录</button></form>
<div class="jobfoot" style="margin:14px 0"><b>投递记录</b><div><button class="secondary" id="export">导出备份</button> <button class="secondary" id="importBtn">导入备份</button><input id="importFile" type="file" accept=".json" hidden></div></div><div id="tracking" class="tracking-list"></div></aside></div></main>
<footer>建议优先使用企业官网或官方招聘系统申请。岗位分析仅作求职参考，不替代招聘方的资格审核。</footer>
<script>
const DATA_URL='./data/jobs.json';let jobs=[];let tracking=JSON.parse(localStorage.getItem('pharmaTrackerV2')||'[]');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function loadJobs(){try{const r=await fetch(DATA_URL+'?v='+Date.now());if(!r.ok)throw Error();const d=await r.json();jobs=d.jobs||[];$('jobCount').textContent=jobs.length;$('lastUpdated').textContent='数据文件更新时间：'+(d.updatedAt?new Date(d.updatedAt).toLocaleString('zh-CN'):'未知');renderJobs()}catch(e){$('jobs').innerHTML='<p class="muted">暂时无法读取招聘数据。请确认 data/jobs.json 已上传。</p>';$('jobCount').textContent='0'}}
function renderJobs(){const q=$('q').value.trim().toLowerCase(),k=$('kind').value,d=$('direction').value;const list=jobs.filter(x=>(!q||[x.company,x.title,x.type,x.direction,x.analysis,x.location].join(' ').toLowerCase().includes(q))&&(!k||x.type===k)&&(!d||x.direction===d));$('jobs').innerHTML=list.length?list.map((x,i)=>'<article class="job"><div class="jobtop"><h3>'+esc(x.title)+'</h3><span class="tag">'+esc(x.type)+'</span></div><b>'+esc(x.company)+'</b><p>'+esc(x.location||'地点以官网为准')+' · '+esc(x.direction||'综合校招')+' · '+esc(x.sourceType||'企业招聘入口')+'</p><p>'+esc(x.analysis||'请进入官方招聘页面核对职责、专业门槛及招聘状态。')+'</p><div class="jobfoot"><a href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer">查看官方来源 ↗</a><button data-i="'+i+'" class="prefill">跟踪投递</button></div></article>').join(''):'<p class="muted">没有找到符合条件的记录。</p>';document.querySelectorAll('.prefill').forEach(b=>b.onclick=()=>{const x=list[+b.dataset.i];$('company').value=x.company;$('role').value=x.title;$('status').value='准备投递';$('company').scrollIntoView({behavior:'smooth',block:'center'})})}
function save(){localStorage.setItem('pharmaTrackerV2',JSON.stringify(tracking));renderTracking()}function renderTracking(){const count=s=>tracking.filter(x=>x.status===s).length;$('appliedCount').textContent=count('已投递');$('interviewCount').textContent=count('面试中');$('offerCount').textContent=count('已获Offer');$('tracking').innerHTML=tracking.length?tracking.map((x,i)=>'<div class="tracking-item"><div><b>'+esc(x.company)+' · '+esc(x.role)+'</b><small>'+esc(x.date||'未填日期')+(x.note?' · '+esc(x.note):'')+'</small></div><select data-i="'+i+'" class="changeStatus">'+['准备投递','已投递','面试中','已获Offer','已结束'].map(s=>'<option '+(x.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select><button data-i="'+i+'" class="delete secondary" title="删除">×</button></div>').join(''):'<p class="muted">还没有投递记录。</p>';document.querySelectorAll('.changeStatus').forEach(e=>e.onchange=()=>{tracking[+e.dataset.i].status=e.value;save()});document.querySelectorAll('.delete').forEach(e=>e.onclick=()=>{tracking.splice(+e.dataset.i,1);save()})}
$('trackForm').onsubmit=e=>{e.preventDefault();tracking.unshift({company:$('company').value.trim(),role:$('role').value.trim(),date:$('date').value,status:$('status').value,note:$('note').value.trim()});save();e.target.reset()};$('export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(tracking,null,2)],{type:'application/json'}));a.download='job-tracker-backup.json';a.click();URL.revokeObjectURL(a.href)};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data))throw Error();tracking=data;save();alert('备份已导入')}catch(err){alert('文件格式不正确')}};['q','kind','direction'].forEach(id=>$(id).addEventListener('input',renderJobs));loadJobs();renderTracking();
</script></body></html>
